# -----------------------------
# Ollama settings
# -----------------------------
ollama.base-url=http://ollama:11434
ollama.embed-model=nomic-embed-text
ollama.chat-model=llama3

# -----------------------------
# Chroma settings
# -----------------------------
vector-db.base-url=http://qdrant:6333
vector-db.vector-size=768

vector.db.collection.codemonks=codemonks_pdf_collection
vector.db.collection.lingual_success=lingual_success_pdf_collection
vector.db.collection.rarr=rarr_pdf_collection

# -----------------------------
# PDF / Chunk settings
# -----------------------------
pdf.chunk-size=500
pdf.chunk-overlap=50

# Multipart upload limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Embedded Tomcat
server.tomcat.max-swallow-size=200MB
server.tomcat.max-http-form-post-size=200MB

server.port=3000